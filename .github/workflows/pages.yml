# Checks every pull request, and publishes the no-install build (dist/hosted) to
# GitHub Pages from main. Reviewers only download manifest.xml from the site and
# upload it in PowerPoint; nothing is installed or run on their PC.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job may write to Pages.
permissions:
  contents: read

# Checks of a pull request replace each other; deploys from main share one group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # A failing check stops the deploy; the site keeps the last good build.
      # Tests that need Edge skip themselves here (the runner has no Edge).
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Site URL
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "${owner}.github.io" ]; then echo "HOSTED_BASE_URL=https://${owner}.github.io/" >> "$GITHUB_ENV"; else echo "HOSTED_BASE_URL=https://${owner}.github.io/${repo}/" >> "$GITHUB_ENV"; fi
      - run: npm run build:hosted
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/hosted
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
